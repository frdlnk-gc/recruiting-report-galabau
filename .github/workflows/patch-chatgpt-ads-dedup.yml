name: Patch ChatGPT Ads event dedup

on:
  push:
    branches: [chatgpt-ads-dedup]
    paths:
      - .github/workflows/patch-chatgpt-ads-dedup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-ads-dedup
      - name: Patch OpenAI pixel event IDs and browser reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = """['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid','oppref'].forEach(function(k){"""
          new = """['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid','oppref'].forEach(function(k){"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    function getFbp(){ return getCookie('_fbp'); }\n    function getFbc(){"""
          new = """    function getFbp(){ return getCookie('_fbp'); }\n    function getObref(){ return getCookie('__obref'); }\n    function getFbc(){"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    function trackOaiqEvent(name){\n      var type = OAIQ_EVENT_TYPES[name];\n      if (!type) { console.warn('[GC] oaiq: unbekanntes Event ' + name + ' — nicht gesendet'); return; }\n      if (!IS_LIVE) { console.info('[GC Preview] oaiq:', name, { type: type }); return; }\n      try { if (typeof window.oaiq === 'function') window.oaiq('measure', name, { type: type }); } catch(e){}\n    }"""
          new = """    function trackOaiqEvent(name, eventId){\n      var type = OAIQ_EVENT_TYPES[name];\n      if (!type) { console.warn('[GC] oaiq: unbekanntes Event ' + name + ' — nicht gesendet'); return; }\n      if (!IS_LIVE) { console.info('[GC Preview] oaiq:', name, { type: type }, eventId || ''); return; }\n      try {\n        if (typeof window.oaiq === 'function') {\n          if (eventId) window.oaiq('measure', name, { type: type }, { event_id: eventId });\n          else window.oaiq('measure', name, { type: type });\n        }\n      } catch(e){}\n    }"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """        fbp: getFbp(),\n        fbc: getFbc(),\n        page_url: location.href,"""
          new = """        fbp: getFbp(),\n        fbc: getFbc(),\n        obref: getObref(),\n        page_url: location.href,"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """          trackOaiqEvent('lead_created');\n          sendLeadStageEvent('lead', leadEventId);"""
          new = """          trackOaiqEvent('lead_created', leadEventId);\n          sendLeadStageEvent('lead', leadEventId);"""
          assert old in s
          s = s.replace(old, new, 1)

          # Also deduplicate downstream standard events against future server-side sends.
          old = """        trackOaiqEvent('registration_completed');"""
          new = """        trackOaiqEvent('registration_completed', crEventId);"""
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "gc-tracking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Deduplicate ChatGPT Ads browser and server lead events"
          git push origin chatgpt-ads-dedup
